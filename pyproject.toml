[project]
name = "beat-internet-time"
version = "0.1.2"
description = "Converts between standard time and Swatch Internet Time beats where the day is divided into 1000 beats."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
